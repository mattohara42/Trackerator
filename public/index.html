<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Trackerator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="plate-title">
      <!-- The wordmark stays inside the h1 so the page keeps a real heading;
           the alt text is what a screen reader announces. Dimensions are on the
           element to reserve the space before it loads, rather than letting the
           topbar jump. -->
      <h1>
        <img class="logo" src="logo.webp" alt="Trackerator" width="560" height="263" />
      </h1>
    </div>
    <div class="topbar-controls">
      <!-- Phones only: filter, sort and the archived toggle fold away behind
           this, so the sticky topbar is one slim row. On desktop the button is
           hidden and the wrapper is display: contents, so nothing changes. -->
      <button id="controlsToggle" class="btn-panel controls-toggle" type="button"
        aria-expanded="false" aria-controls="viewControls">VIEW</button>
      <div id="viewControls" class="view-controls">
        <label class="filter-label" for="statusFilter">FILTER</label>
        <select id="statusFilter">
          <option value="">ALL</option>
          <option value="active">ACTIVE</option>
          <option value="paused">PAUSED</option>
          <option value="idea">IDEA</option>
          <option value="done">DONE</option>
          <option value="archived">ARCHIVED</option>
        </select>
        <label class="filter-label" for="sortBy">SORT</label>
        <select id="sortBy">
          <option value="attention">NEEDS ATTENTION</option>
          <option value="stale">LONGEST NEGLECTED</option>
          <option value="recent">MOST RECENT</option>
          <option value="incomplete">LEAST COMPLETE</option>
          <option value="name">NAME</option>
        </select>
        <label class="toggle" for="showArchived">
          <input type="checkbox" id="showArchived" />
          SHOW ARCHIVED
        </label>
        <span id="syncedAt" class="synced-at"></span>
      </div>
      <button id="syncBtn" class="btn-panel">
        <span class="btn-led"></span>
        <span id="syncLabel">SYNC UPLINK</span>
      </button>
    </div>
  </header>

  <div id="overview" class="overview"></div>

  <div id="pick" class="pick"></div>

  <p id="archivedNote" class="archived-note"></p>

  <main id="grid" class="grid"></main>

  <p id="emptyState" class="empty-state" hidden>
    NO SIGNAL — no repos tracked yet. Hit <strong>SYNC UPLINK</strong> to pull
    them in. Requires <code>GITHUB_TOKEN</code> set as a Netlify environment
    variable (or in <code>.env</code> when running locally).
  </p>

  <!-- ES module: app.js imports ./safe.js. Still no build step. -->
  <script type="module" src="app.js"></script>
</body>
</html>
